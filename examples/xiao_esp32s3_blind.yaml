substitutions:
  device_name: sts3215-blind-demo
  friendly_name: STS3215 Blind Demo

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: seeed_xiao_esp32s3
  framework:
    type: esp-idf

logger:
  # Native USB logging leaves the servo UART free.
  hardware_uart: USB_SERIAL_JTAG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source: github://DexiTheOne/esphome-sts3215@main
    components: [sts3215]

# XIAO ESP32-S3: D6/TX = GPIO43 and D7/RX = GPIO44.
# With the XIAO plugged into Seeed's bus-servo driver, the board routes these
# through its half-duplex TTL interface. Set the driver's mode jumper to UART.
uart:
  id: servo_uart
  tx_pin: GPIO43
  rx_pin: GPIO44
  baud_rate: 1000000
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 256

sts3215:
  id: blind_servo_bus
  uart_id: servo_uart
  update_interval: 500ms
  # Every individual and group-cover command uses this one bus-wide queue.
  # With six motors, IDs are started in the order listed below.
  start_delay: 2s
  move_timeout: 2min
  position_tolerance: 5
  main_cover:
    name: All Blinds
  servos:
    - servo_id: 1
      inverted: false
      initial_speed: 90
      initial_acceleration: 20
      initial_torque_limit: 30
      cover:
        name: Blind 1
      # Press once during commissioning. If mode 3 is already set, this button
      # performs no EEPROM write. Power-cycle the full node after a successful set.
      commission_step_mode:
        name: Blind 1 Commission Multi-Turn Mode
      position:
        name: Blind 1 Encoder Position
      position_raw:
        name: Blind 1 Encoder Position Raw
      speed:
        name: Blind 1 Servo Speed
      load:
        name: Blind 1 Servo Torque Output
      temperature:
        name: Blind 1 Servo Temperature
      voltage:
        name: Blind 1 Servo Voltage
      current:
        name: Blind 1 Servo Current
      status:
        name: Blind 1 Servo Status
      moving:
        name: Blind 1 Servo Moving
      torque_enabled:
        name: Blind 1 Torque Enabled
      target_position:
        name: Blind 1 Multi-Turn Target
      speed_limit:
        name: Blind 1 Speed Limit
      acceleration:
        name: Blind 1 Acceleration
      torque_limit:
        name: Blind 1 Torque Limit
      calibration:
        jog_increment:
          name: Blind 1 Jog Increment
        jog_forward:
          name: Blind 1 Jog Forward
        jog_reverse:
          name: Blind 1 Jog Reverse
        set_down:
          name: Blind 1 Set Fully Down
        set_middle:
          name: Blind 1 Set Middle
        set_up:
          name: Blind 1 Set Fully Up

    # Scale to six motors by copying the item above and changing servo_id and
    # entity names. Every servo has independent settings and calibration.

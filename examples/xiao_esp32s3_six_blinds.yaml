# Six-blind XIAO ESP32-S3 example. Store Wi-Fi credentials in secrets.yaml.
# Auto calibrate missing/reset blinds individually before using All Blinds.
substitutions:
  device_name: sts3215-six-blinds
  friendly_name: STS3215 Six Blinds

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: seeed_xiao_esp32s3
  framework:
    type: esp-idf

logger:
  # Native USB logging leaves the servo UART free.
  hardware_uart: USB_SERIAL_JTAG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source: github://DexiTheOne/esphome-sts3215@main
    refresh: always
    components: [sts3215]

# XIAO ESP32-S3: D6/TX = GPIO43 and D7/RX = GPIO44.
# With the XIAO plugged into Seeed's bus-servo driver, the board routes these
# through its half-duplex TTL interface. Set the driver's mode jumper to UART.
uart:
  id: servo_uart
  tx_pin: GPIO43
  rx_pin: GPIO44
  baud_rate: 1000000
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 256

sts3215:
  id: blind_servo_bus
  uart_id: servo_uart
  update_interval: 500ms
  # Every individual and group-cover command uses this one bus-wide queue.
  # Physical order: 6, 5, 4, 3, 2, 1. Ripple pairs: 6+1, then 5+2, then 4+3.
  # Staggered waits for both complete sequences before starting the next pair.
  movement_mode: staggered
  movement_order: ripple
  start_delay: 2s
  move_timeout: 2min
  position_tolerance: 5
  # Disable packet-level tracing for normal operation.
  uart_trace: false
  # XIAO D0 / GPIO1 drives an active-high relay for the shared motor supply.
  # Use a relay module with a 3.3 V-compatible input; hold its input low at boot.
  power_pin:
    number: GPIO1
    inverted: false
  power_on_delay: 1s
  power_off_delay: 5s
  main_cover:
    name: All Blinds
  servos:

    - servo_id: 6
      inverted: false
      initial_speed: 90
      initial_acceleration: 20
      max_acceleration: 50
      initial_torque_limit: 30
      # Every decreasing tilt transition first travels through 0% so gravity
      # settles the blind leaves consistently. Increasing transitions are direct.
      gravity_return_to_zero: true
      cover:
        name: Blind 6
      position:
        name: Blind 6 Encoder Position
      position_raw:
        name: Blind 6 Encoder Position Raw
      speed:
        name: Blind 6 Servo Speed
      load:
        name: Blind 6 Servo Torque Output
      temperature:
        name: Blind 6 Servo Temperature
      voltage:
        name: Blind 6 Servo Voltage
      current:
        name: Blind 6 Servo Current
      status:
        name: Blind 6 Servo Status
      moving:
        name: Blind 6 Servo Moving
      torque_enabled:
        name: Blind 6 Torque Enabled
      multi_turn_mode:
        name: Blind 6 Multi-Turn Mode Active
      speed_limit:
        name: Blind 6 Speed Limit
        mode: slider
      acceleration:
        name: Blind 6 Acceleration
        mode: slider
      torque_limit:
        name: Blind 6 Torque Limit
        mode: slider
      calibration:
        auto_calibrate:
          name: Blind 6 Auto Calibrate
        negative_direction:
          name: Blind 6 Negative Direction
        reset_blinds:
          name: Blind 6 Reset Calibration
        status:
          name: Blind 6 Calibration Status
        jog_increment:
          name: Blind 6 Jog Increment
        jog_forward:
          name: Blind 6 Jog Forward
        jog_reverse:
          name: Blind 6 Jog Reverse
        set_down:
          name: Blind 6 Set Fully Down
        set_middle:
          name: Blind 6 Set Middle
        set_up:
          name: Blind 6 Set Fully Up


# Six-blind XIAO ESP32-S3 example. Store Wi-Fi credentials in secrets.yaml.
# Auto calibrate missing/reset blinds individually before using All Blinds.
substitutions:
  device_name: sts3215-six-blinds
  friendly_name: STS3215 Six Blinds

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: seeed_xiao_esp32s3
  framework:
    type: esp-idf

logger:
  # Native USB logging leaves the servo UART free.
  hardware_uart: USB_SERIAL_JTAG

api:

web_server:
  port: 80
  version: 3
  local: true
  include_internal: true
  sorting_groups:
    - id: all_blinds_group
      name: "All Blinds"
      sorting_weight: 0
    - id: blind_6_group
      name: "Blind 6"
      sorting_weight: 10
    - id: blind_5_group
      name: "Blind 5"
      sorting_weight: 20
    - id: blind_4_group
      name: "Blind 4"
      sorting_weight: 30
    - id: blind_3_group
      name: "Blind 3"
      sorting_weight: 40
    - id: blind_2_group
      name: "Blind 2"
      sorting_weight: 50
    - id: blind_1_group
      name: "Blind 1"
      sorting_weight: 60
  ota: false

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source: github://DexiTheOne/esphome-sts3215@main
    refresh: always
    components: [sts3215]

# XIAO ESP32-S3: D6/TX = GPIO43 and D7/RX = GPIO44.
# With the XIAO plugged into Seeed's bus-servo driver, the board routes these
# through its half-duplex TTL interface. Set the driver's mode jumper to UART.
uart:
  id: servo_uart
  tx_pin: GPIO43
  rx_pin: GPIO44
  baud_rate: 1000000
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 256

sts3215:
  id: blind_servo_bus
  uart_id: servo_uart
  update_interval: 500ms
  # Every individual and group-cover command uses this one bus-wide queue.
  # Physical order: 6, 5, 4, 3, 2, 1. Ripple pairs: 6+1, then 5+2, then 4+3.
  # Staggered waits for both complete sequences before starting the next pair.
  movement_mode: staggered
  movement_order: ripple
  start_delay: 2s
  move_timeout: 2min
  position_tolerance: 5
  # Disable packet-level tracing for normal operation.
  uart_trace: false
  # XIAO D0 / GPIO1 drives an active-high relay for the shared motor supply.
  # Use a relay module with a 3.3 V-compatible input; hold its input low at boot.
  power_pin:
    number: GPIO1
    inverted: false
  power_on_delay: 1s
  power_off_delay: 5s
  main_cover:
    name: All Blinds
    web_server:
      sorting_group_id: all_blinds_group
      sorting_weight: 0
  servos:

    - servo_id: 6
      inverted: false
      initial_speed: 90
      initial_acceleration: 20
      max_acceleration: 50
      initial_torque_limit: 30
      # Every decreasing tilt transition first travels through 0% so gravity
      # settles the blind leaves consistently. Increasing transitions are direct.
      gravity_return_to_zero: true
      cover:
        name: Blind 6
        web_server:
          sorting_group_id: blind_6_group
          sorting_weight: 0
      position:
        name: Blind 6 Encoder Position
        web_server:
          sorting_group_id: blind_6_group
        internal: true
      position_raw:
        name: Blind 6 Encoder Position Raw
        web_server:
          sorting_group_id: blind_6_group
        internal: true
      speed:
        name: Blind 6 Servo Speed
        web_server:
          sorting_group_id: blind_6_group
        internal: true
      load:
        name: Blind 6 Servo Torque Output
        web_server:
          sorting_group_id: blind_6_group
        internal: true
      temperature:
        name: Blind 6 Servo Temperature
        web_server:
          sorting_group_id: blind_6_group
        internal: true
      voltage:
        name: Blind 6 Servo Voltage
        web_server:
          sorting_group_id: blind_6_group
        internal: true
      current:
        name: Blind 6 Servo Current
        web_server:
          sorting_group_id: blind_6_group
        internal: true
      status:
        name: Blind 6 Servo Status
        web_server:
          sorting_group_id: blind_6_group
        internal: true
      moving:
        name: Blind 6 Servo Moving
        web_server:
          sorting_group_id: blind_6_group
        internal: true
      torque_enabled:
        name: Blind 6 Torque Enabled
        web_server:
          sorting_group_id: blind_6_group
        internal: true
      multi_turn_mode:
        name: Blind 6 Multi-Turn Mode Active
        web_server:
          sorting_group_id: blind_6_group
        internal: true
      speed_limit:
        name: Blind 6 Speed Limit
        web_server:
          sorting_group_id: blind_6_group
        internal: true
        mode: slider
      acceleration:
        name: Blind 6 Acceleration
        web_server:
          sorting_group_id: blind_6_group
        internal: true
        mode: slider
      torque_limit:
        name: Blind 6 Torque Limit
        web_server:
          sorting_group_id: blind_6_group
        internal: true
        mode: slider
      calibration:
        auto_torque_limit: 25%
        auto_calibrate:
          name: Blind 6 Auto Calibrate
          web_server:
            sorting_group_id: blind_6_group
          internal: true
        negative_direction:
          name: Blind 6 Negative Direction
          web_server:
            sorting_group_id: blind_6_group
          internal: true
        reset_blinds:
          name: Blind 6 Reset Calibration
          web_server:
            sorting_group_id: blind_6_group
          internal: true
        status:
          name: Blind 6 Calibration Status
          web_server:
            sorting_group_id: blind_6_group
          internal: true
        jog_increment:
          name: Blind 6 Jog Increment
          web_server:
            sorting_group_id: blind_6_group
          internal: true
        jog_forward:
          name: Blind 6 Jog Forward
          web_server:
            sorting_group_id: blind_6_group
          internal: true
        jog_reverse:
          name: Blind 6 Jog Reverse
          web_server:
            sorting_group_id: blind_6_group
          internal: true
        set_down:
          name: Blind 6 Set Fully Down
          web_server:
            sorting_group_id: blind_6_group
          internal: true
        set_middle:
          name: Blind 6 Set Middle
          web_server:
            sorting_group_id: blind_6_group
